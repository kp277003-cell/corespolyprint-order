<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e8a900"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Order Form">
<title>Corespolyprint Order Form</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@600;700&display=swap">
<style>
:root{--bg:#eef1f5;--sheet:#fff;--ink:#2a1f00;--hd:#e8a900;--tx:#1a2433;--mu:#5a6a80;--bd:#d5dce6;--field:#f6f8fb;--ac:#e8a900;--onac:#2a1f00;--focus:#a87000;--rd:#d1242f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1522;--sheet:#16202f;--tx:#e7ecf3;--mu:#93a1b5;--bd:#2a3647;--field:#101926;--focus:#ffc83d;--rd:#ff6b6b}}
:root[data-theme="dark"]{--bg:#0d1522;--sheet:#16202f;--tx:#e7ecf3;--mu:#93a1b5;--bd:#2a3647;--field:#101926;--focus:#ffc83d;--rd:#ff6b6b}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--hd)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.4 Barlow,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;padding-bottom:130px}
.wrap{max-width:560px;margin:0 auto;padding:0 18px}
.top{background:var(--hd);color:var(--ink);padding:22px 0 44px}
.top .wrap{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
h1{font:700 30px/1.1 "Barlow Semi Condensed",Barlow,system-ui,sans-serif;margin:0}
.top p{margin:6px 0 0;font:600 18px "Barlow Semi Condensed",Barlow,system-ui,sans-serif;opacity:.8}
.top input{width:auto;background:rgba(42,31,0,.14);color:var(--ink);border:0;border-radius:999px;padding:8px 14px;font:500 15px Barlow,system-ui,sans-serif;pointer-events:none;color-scheme:light;min-width:0;font-weight:600}
.top input::-webkit-calendar-picker-indicator{display:none}
.sheet{background:var(--sheet);border-radius:18px;margin-top:-26px;padding:6px 18px 20px;border:1px solid var(--bd)}
section{padding:16px 0 6px;border-top:1px solid var(--bd)}
section:first-child{border-top:0}
h2{font:600 19px/1.2 "Barlow Semi Condensed",Barlow,system-ui,sans-serif;margin:0 0 4px;color:var(--ink)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) h2{color:var(--tx)}}
:root[data-theme="dark"] h2{color:var(--tx)}
label{display:block;font-size:15px;font-weight:700;color:var(--tx);margin:12px 0 5px}
.rq{color:var(--rd);font-style:normal}
input,select,textarea{width:100%;font:inherit;color:var(--tx);background:var(--field);border:1.5px solid var(--bd);border-radius:12px;padding:13px 14px;min-height:50px;outline:0;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--focus);box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 25%,transparent)}
.bad{border-color:var(--rd)!important}
.qty{display:flex;gap:10px}.qty input{flex:1;min-width:0}.qty select{width:100px}
.ups{display:flex;gap:10px}
.up{position:relative;flex:1;display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border:1.5px dashed var(--bd);border-radius:12px;color:var(--ink);font-weight:600;overflow:hidden;background:var(--field)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .up{color:var(--tx)}}
:root[data-theme="dark"] .up{color:var(--tx)}
.up svg{width:20px;height:20px;flex:none}
.up input{position:absolute;top:0;left:0;width:100%;height:100%;opacity:0;padding:0;border:0;cursor:pointer}
.pv{display:none;width:100%;max-height:260px;object-fit:contain;border-radius:12px;margin-top:10px;border:1px solid var(--bd);background:var(--field)}
#rm{display:none;margin-top:8px;background:none;border:0;color:var(--rd);font:600 15px Barlow,system-ui,sans-serif;padding:8px 0;cursor:pointer}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--sheet);border-top:1px solid var(--bd);padding:10px 0;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.msg{font-size:14px;color:var(--mu);margin:0 0 8px}.msg:empty{display:none}
.btns{display:flex;gap:10px}
button{font:inherit;cursor:pointer}
.go{flex:1;min-height:54px;border:0;border-radius:14px;background:var(--ac);color:var(--onac);font-weight:700;font-size:18px}
.gh{min-height:54px;padding:0 20px;border-radius:14px;background:transparent;border:1.5px solid var(--bd);color:var(--tx);font-weight:600}
.go:active,.gh:active{transform:scale(.98)}
.inst{display:none;flex:1;align-items:center;gap:10px;margin-top:14px;background:rgba(42,31,0,.13);border-radius:12px;padding:10px 12px;font-weight:600;font-size:15px;line-height:1.25}
.inst span{flex:1}
.inst button{border:0;border-radius:10px;font:700 15px Barlow,system-ui,sans-serif;cursor:pointer}
#instBtn{background:var(--ink);color:var(--hd);padding:9px 14px}
#instX{background:none;color:var(--ink);font-size:20px;padding:0 4px}
</style></head><body>
<header class="top"><div class="wrap"><div><h1>Corespolyprint</h1><p>Order Form</p></div><input id="date" type="date" readonly tabindex="-1" aria-label="Date"></div></div><div class="wrap"><div class="inst" id="inst"><span id="instTxt">Install this app on your phone</span><button type="button" id="instBtn">Install</button><button type="button" id="instX" aria-label="Close">×</button></div></div></header>
<main class="wrap"><div class="sheet">
<section><h2>Job</h2>
<label for="jobName">Job name <i class="rq">*</i></label><input id="jobName" placeholder="e.g. Ollie Coconut">
<label for="jobType">Job type <i class="rq">*</i></label><select id="jobType"><option value="">Select…</option><option>Roll Form</option><option>Pouch Form</option></select>
</section>
<section><h2>Material</h2>
<label for="structure">Material structure <i class="rq">*</i></label><input id="structure" placeholder="e.g. PET + MPET + LD">
<label for="micron">Material micron <i class="rq">*</i></label><input id="micron" type="text" inputmode="tel" placeholder="e.g. 12 + 12 + 50">
<label for="direction">Material direction <i class="rq">*</i></label><select id="direction"><option value="">Select…</option><option>Readable</option><option>Unreadable</option></select>
</section>
<section><h2>Quantity</h2>
<label for="qty">Order qty <i class="rq">*</i></label><div class="qty"><input id="qty" type="number" step="any" min="0" inputmode="decimal" placeholder="e.g. 500"><select id="qtyUnit" aria-label="Unit"><option>Kg</option><option>Pcs</option></select></div>
<label for="rollKg">Slitting roll weight (KG) <i class="rq">*</i></label><input id="rollKg" type="number" step="any" min="0" inputmode="decimal" placeholder="e.g. 25">
</section>
<section><h2>Job JPG</h2>
<label>Image <i class="rq">*</i></label>
<div class="ups"><div class="up" id="docBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Files<input id="doc" type="file" accept="image/jpeg,image/png,image/webp,.jpg,.jpeg,.png,.webp"></div><div class="up" id="camBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.5"/></svg>Camera<input id="cam" type="file" accept="image/*" capture="environment"></div></div>
<img id="pv" class="pv" alt="Selected image"><button type="button" id="rm" onclick="setImg('')">Remove image</button>
<label for="note">Note</label><textarea id="note" rows="3"></textarea>
</section>
</div></main>
<div class="bar"><div class="wrap"><div class="msg" id="msg"></div><div class="btns"><button class="go" onclick="share()">Share order</button><button class="gh" onclick="clearForm()">Clear</button></div></div></div>
<script>
const F=[["date","Date"],["jobName","Job Name"],["jobType","Job Type"],["structure","Material Structure"],["micron","Material Micron"],["qty","Order Qty"],["qtyUnit","Qty Unit"],["rollKg","Slitting Roll Weight (KG)"],["direction","Material Direction"],["note","Note"]];
const $=id=>document.getElementById(id);
function today(){const d=new Date(),p=n=>String(n).padStart(2,"0");return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())}
let orders=[],img="";
function setImg(d){if(!d)lastF=null;img=d;$("pv").src=d;$("pv").onerror=()=>{if(!img)return;setImg("");say("This photo format is not supported. Try another photo.")};$("pv").style.display=d?"block":"none";$("rm").style.display=d?"inline-block":"none";if(!d){$("doc").value="";$("cam").value=""}}
$("micron").oninput=e=>{const t=e.target,p=t.selectionStart;t.value=t.value.replace(/,/g,"+");try{t.setSelectionRange(p,p)}catch(x){}};
$("structure").oninput=e=>{const t=e.target,p=t.selectionStart;const q=t.value,v=q.replace(/[0-9]/g,"").replace(/,/g,"+");if(v!==q){t.value=v;try{t.setSelectionRange(p-(q.length-v.length),p-(q.length-v.length))}catch(x){}}};
let lastF=null;
function pick(e){const f=e.target.files&&e.target.files[0];if(!f||f===lastF)return;lastF=f;say("Selected: "+f.name+" — loading…");const fr=new FileReader();
fr.onerror=()=>say("Could not read this file.");
fr.onload=()=>{const d=fr.result,im=new Image();
im.onload=()=>{let out=d;try{const m=800,k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);out=c.toDataURL("image/jpeg",.7)}catch(x){}setImg(out);say("Image added.")};
im.onerror=()=>{setImg(d);say("Image added.")};im.src=d};
fr.readAsDataURL(f)}
["doc","cam"].forEach(id=>{["change","input"].forEach(ev=>$(id).addEventListener(ev,pick))});

try{orders=JSON.parse(localStorage.getItem("orders")||"[]")}catch(e){orders=[]}
function persist(){try{localStorage.setItem("orders",JSON.stringify(orders));return true}catch(e){return false}}
function read(){const o={};F.forEach(([k])=>o[k]=$(k).value.trim());o.image=img;return o}
function text(o){const L="━━━━━━━━━━━━━━",v=k=>k==="qty"?(o.qty?o.qty+" "+(o.qtyUnit||"Kg"):""):(o[k]||"");
return "New Order\n"+L+"\n"+[["date","Date"],["jobName","Job Name"],["jobType","Job Type"],["qty","Order Qty"],["structure","Material Structure"],["micron","Material Micron"],["rollKg","Slitting Roll Weight (KG)"],["direction","Material Direction"],["note","Note"]].map(([k,l])=>"➤ "+l+" : "+v(k)).join("\n")+"\n"+L}
function say(t){$("msg").textContent=t}
function check(){let bad=[];document.querySelectorAll(".bad").forEach(e=>e.classList.remove("bad"));
F.forEach(([k,l])=>{if(k==="qtyUnit"||k==="note")return;if(!$(k).value.trim()){bad.push(l);$(k).classList.add("bad")}});
if(!img){bad.push("Image");$("docBtn").classList.add("bad");$("camBtn").classList.add("bad")}
if(bad.length){say("Required: "+bad.join(", "));return false}return true}
["jobName","structure","note"].forEach(id=>{const el=$(id);el.setAttribute("autocapitalize","words");el.addEventListener("input",()=>{const p=el.selectionStart,v=el.value.replace(/(^|\s)([a-z])/g,(m,a,b)=>a+b.toUpperCase());if(v!==el.value){el.value=v;try{el.setSelectionRange(p,p)}catch(x){}}})});
(()=>{const el=$("structure");el.setAttribute("autocapitalize","characters");el.addEventListener("input",()=>{const p=el.selectionStart,v=el.value.toUpperCase();if(v!==el.value){el.value=v;try{el.setSelectionRange(p,p)}catch(x){}}})})();
["structure","micron"].forEach(id=>{const el=$(id),n=t=>t.replace(/\s*\+\s*/g," + ").replace(/\s{2,}/g," ").replace(/^\s+/,"");el.addEventListener("input",e=>{if(e.inputType&&e.inputType.indexOf("delete")===0)return;const p=el.selectionStart,v=n(el.value);if(v!==el.value){const q=n(el.value.slice(0,p)).length;el.value=v;try{el.setSelectionRange(q,q)}catch(x){}}})});
["structure","micron"].forEach(id=>{const el=$(id);el.addEventListener("input",e=>{if(e.inputType&&e.inputType.indexOf("delete")===0)return;const v=el.value,p=el.selectionStart;if(p>1&&v[p-1]===" "&&v[p-2]!=="+"&&v[p-2]!==" "){el.value=v.slice(0,p-1)+" + "+v.slice(p);try{el.setSelectionRange(p+2,p+2)}catch(x){}}})});
document.addEventListener("input",e=>e.target.classList&&e.target.classList.remove("bad"));
document.addEventListener("change",e=>{$("docBtn").classList.remove("bad");$("camBtn").classList.remove("bad")});
function save(){if(!check())return;const o=read();o.id=Date.now();orders.unshift(o);render();say(persist()?"Saved.":"Saved for this session only (storage full).")}
function wipe(){F.forEach(([k])=>{const el=$(k);el.value="";if(el.tagName==="INPUT")el.setAttribute("value","")});$("date").value=today();$("qtyUnit").value="Kg"}
function clearForm(){try{if(document.activeElement&&document.activeElement.blur)document.activeElement.blur()}catch(e){}try{localStorage.removeItem("draft")}catch(e){}wipe();setImg("");say("");setTimeout(wipe,60);setTimeout(()=>{wipe();try{localStorage.removeItem("draft")}catch(e){}},500)}
async function share(){if(!check())return;const o=read(),t=text(o);
try{if(navigator.share){const p={text:t};if(o.image){try{const b=await (await fetch(o.image)).blob(),f=new File([b],((o.jobName||"order").replace(/[\\\/:*?"<>|]+/g,"").trim()||"order")+".jpg",{type:"image/jpeg"});if(navigator.canShare&&navigator.canShare({files:[f]}))p.files=[f]}catch(x){}}await navigator.share(p);clearForm();return}}catch(e){if(e&&e.name==="AbortError")return}
try{await navigator.clipboard.writeText(t);{clearForm();say("Copied. Form cleared.")}}catch(e){const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy");{clearForm();say("Copied. Form cleared.")}}catch(x){say("Copy not available.")}a.remove()}}
function load(id){const o=orders.find(x=>x.id===id);if(!o)return;F.forEach(([k])=>$(k).value=o[k]||"");$("qtyUnit").value=o.qtyUnit||"Kg";$("date").value=o.date||today();setImg(o.image||"");scrollTo(0,0);say("Loaded.")}
function del(id){orders=orders.filter(x=>x.id!==id);persist();render()}
function render(){const L=$("list");if(!L)return;if(!orders.length){L.innerHTML='<div class="msg">None yet.</div>';return}
L.innerHTML="";orders.forEach(o=>{const d=document.createElement("div");d.className="item";
const i=document.createElement("div");i.style.flex="1";const b=document.createElement("b");b.textContent=o.jobName;const s=document.createElement("span");s.textContent=[o.date,o.jobType,o.structure,o.qty&&("Qty "+o.qty+" "+(o.qtyUnit||"Kg"))].filter(Boolean).join(" · ");i.append(b,s);
if(o.image){const t=document.createElement("img");t.src=o.image;t.className="th";d.append(t)}
const a=document.createElement("div");a.style.display="flex";a.style.gap="6px";
const e=document.createElement("button");e.className="s";e.textContent="Open";e.onclick=()=>load(o.id);
const x=document.createElement("button");x.className="d";x.textContent="Delete";x.onclick=()=>del(o.id);
a.append(e,x);d.append(i,a);L.append(d)})}
try{localStorage.removeItem("draft")}catch(e){}
$("date").value=today();
render();
(function(){const bar=$("inst"),btn=$("instBtn"),txt=$("instTxt");
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
if(matchMedia("(display-mode: standalone)").matches||navigator.standalone)return;
let dp=null;
addEventListener("beforeinstallprompt",e=>{e.preventDefault();dp=e;txt.textContent="Install this app on your phone";btn.style.display="";bar.style.display="flex"});
btn.onclick=async()=>{if(!dp)return;dp.prompt();try{await dp.userChoice}catch(e){}dp=null;bar.style.display="none"};
$("instX").onclick=()=>{bar.style.display="none"};
addEventListener("appinstalled",()=>{bar.style.display="none"});
if(/iphone|ipad|ipod/i.test(navigator.userAgent)){txt.textContent="To install: tap Share, then Add to Home Screen";btn.style.display="none";bar.style.display="flex"}
})();
</script></body></html>
